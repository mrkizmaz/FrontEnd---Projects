<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Maps</title>

    <!-- Leaflet library css -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/style.css">

    <!-- Bootstrap CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <!-- Yan Icerik -->
    <aside class="add">
        <div class="sidebar">
            <h1>Notlar</h1>

            <h1 id="add-title">Yeni Not</h1>

            <form>
                <div class="field">
                    <label>Durum</label>
                    <input type="text" required>
                </div>

                <div class="field">
                    <label>Tarih</label>
                    <input type="date" required>
                </div>

                <div class="field">
                    <label>Durum</label>
                    <select required>
                        <option value="" disabled selected>Seciniz...</option>
                        <option value="goto">Ziyaret</option>
                        <option value="park">Park Yeri</option>
                        <option value="job">Is</option>
                        <option value="home">Ev</option>
                    </select>

                </div>

                <div class="buttons">
                    <button>Ekle</button>
                    <button>Iptal</button>
                </div>
            </form>

            <ul>
                <li>
                    <div>
                        <p>Durak - 1</p>
                        <p>06.10.2025</p>
                        <p>Is</p>
                    </div>

                    <div class="icons">
                        <i class="bi bi-airplane-fill" id="fly"></i>
                        <i class="bi bi-trash-fill" id="delete"></i>
                    </div>
                </li>
            </ul>
        </div>
    </aside>

    <!-- Harita -->
    <div id="map"></div>






    <!-- Leaflet library js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- main js -->
    <script type="module" src="scripts/main.js"></script>

</body>

</html>
